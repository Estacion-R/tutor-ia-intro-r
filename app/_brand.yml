# _brand.yml · Estación R (proyecto: tutor_ia_intro_r)
# Copia local sincronizada con la fuente de verdad:
#   /Pablo/Estación R/Proyectos/_activos/identidad_visual/_brand.yml
# Mantenerla sincronizada cuando cambie la guía central.
#
# Diferencias vs. la fuente:
# - typography.fonts: solo Ubuntu (Google). Array no se usa en esta app
#   (no hay H1 hero); si se necesita en el futuro, cargarlo aparte vía CDN
#   Fontshare en tags$head().

color:
  palette:
    azul:       "#405BFF"
    azul-dark:  "#1839F4"
    amarillo:   "#EAFF38"
    negro:      "#191919"
    blanco:     "#FFFFFF"
    gris-claro: "#F7F7F7"

  foreground: negro
  background: blanco
  primary:    azul
  secondary:  amarillo
  dark:       negro
  light:      gris-claro

typography:
  fonts:
    - family: Ubuntu
      source: google
      weight: [300, 400, 500, 700]

  base:     Ubuntu
  headings: Ubuntu

  monospace-block:
    color: "#1839F4"
